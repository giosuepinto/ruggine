[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "minwinbase"] }
[package]
name = "ruggine_server"
version = "0.1.0"
edition = "2024"


[dependencies]
argon2 = { version = "=0.4.1", features = ["password-hash", "std"] }
axum = { version = "0.8.6", features = ["ws"] }
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
jsonwebtoken = { version = "10.2.0", features = ["default", "rust_crypto", "use_pem"] }
password-hash = { version = "=0.4.2", features = ["std", "rand_core"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
sysinfo = "0.36.1"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
libc = "0.2.177"
